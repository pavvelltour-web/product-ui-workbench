name: Validate skill and portable package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        working-directory: examples/showcase/app
      - run: npm run build
        working-directory: examples/showcase/app
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_public.py
      - run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-render.txt
      - name: Require actual browser and configure tests
        run: |
          python - <<'PY'
          import os, shutil, subprocess, sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable=next((path for name in ('google-chrome', 'google-chrome-stable', 'chromium', 'chromium-browser') if (path:=shutil.which(name))), None)
              if executable is None:
                  subprocess.run([sys.executable, '-m', 'playwright', 'install', '--with-deps', 'chromium'], check=True, timeout=240)
                  executable=p.chromium.executable_path
              assert Path(executable).is_file()
              browser=p.chromium.launch(executable_path=executable, headless=True)
              browser.close()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('WORKBENCH_CHROME='+executable+'\n')
          PY
      - run: python scripts/check_public.py
      - run: python -m unittest discover -s tests -v
