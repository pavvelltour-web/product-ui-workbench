name: Validate skill and portable package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_public.py
      - run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-render.txt
      - run: python -m playwright install --with-deps chromium
      - name: Require actual browser and configure tests
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable=p.chromium.executable_path
              assert Path(executable).is_file()
              browser=p.chromium.launch(headless=True)
              browser.close()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('WORKBENCH_CHROME='+executable+'\n')
          PY
      - run: python scripts/check_public.py
      - run: python -m unittest discover -s tests -v
